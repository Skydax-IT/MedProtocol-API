[project]
name = "deterministic-triage-api"version = "0.1.0"
description = "Demo-only deterministic triage protocol API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13.3,<2.0.0",
  "fastapi[standard]>=0.115.0,<1.0.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
  "pydantic>=2.8.2,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.2,<1.0.0",
  "mypy>=1.11.2,<2.0.0",
  "pytest>=8.3.3,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.6.9,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
